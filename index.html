<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStar - Quản Lý & Đặt Vé Rạp Chiếu Phim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .seat { transition: all 0.2s ease; cursor: pointer; }
    .seat:hover:not(.occupied) { transform: scale(1.15); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Navbar -->
  <nav class="bg-slate-900/90 backdrop-blur sticky top-0 z-50 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-film text-red-500 text-2xl"></i>
      <span class="text-xl font-bold tracking-wider text-red-500 uppercase">CineStar</span>
    </div>
    <div class="flex space-x-4">
      <button onclick="switchTab('booking')" class="px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-sm font-medium transition">
        <i class="fa-solid fa-ticket mr-1"></i> Đặt Vé Khách Hàng
      </button>
      <button onclick="switchTab('admin')" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm font-medium transition border border-slate-700">
        <i class="fa-solid fa-chart-line mr-1"></i> Quản Trị Viên (Admin)
      </button>
    </div>
  </nav>

  <!-- Giao diện Khách Hàng (Booking) -->
  <main id="bookingSection" class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-900 p-6 rounded-2xl border border-slate-800">
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-2 font-semibold">1. Chọn Phim</label>
        <select id="movieSelect" onchange="renderSeats()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-red-500">
          <option value="100000" data-title="Mai (Trấn Thành)">Mai (100.000 VNĐ)</option>
          <option value="120000" data-title="Dune: Hành Tinh Cát 2">Dune: Hành Tinh Cát 2 (120.000 VNĐ)</option>
          <option value="90000" data-title="Kung Fu Panda 4">Kung Fu Panda 4 (90.000 VNĐ)</option>
          <option value="110000" data-title="Godzilla x Kong">Godzilla x Kong (110.000 VNĐ)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-2 font-semibold">2. Chọn Suất Chiếu</label>
        <select id="showtimeSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none">
          <option>14:30 - Rạp 01 (2D Phụ đề)</option>
          <option>17:00 - Rạp 02 (2D Lồng tiếng)</option>
          <option>19:45 - Rạp 01 (IMAX 2D)</option>
          <option>21:30 - Rạp 03 (2D Phụ đề)</option>
        </select>
      </div>
      <div class="flex flex-col justify-end">
        <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700/60 flex items-center justify-between">
          <span class="text-sm text-slate-400">Đã chọn: <b id="count" class="text-white">0</b> ghế</span>
          <span class="text-sm font-bold text-red-400" id="total">0 VNĐ</span>
        </div>
      </div>
    </div>

    <!-- Sơ đồ phòng chiếu -->
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex flex-col items-center">
      <div class="w-3/4 h-3 bg-gradient-to-r from-red-600 to-red-400 rounded-full shadow-[0_0_20px_rgba(239,68,68,0.6)] mb-2"></div>
      <p class="text-xs text-slate-400 mb-8 font-semibold tracking-widest uppercase">Màn Hình Chiếu</p>

      <div id="seatContainer" class="grid grid-cols-8 gap-3 mb-8"></div>

      <!-- Chú thích -->
      <div class="flex flex-wrap gap-4 text-xs text-slate-400 justify-center border-t border-slate-800 pt-4 w-full">
        <div class="flex items-center gap-2"><div class="w-4 h-4 rounded bg-slate-700"></div> Ghế thường</div>
        <div class="flex items-center gap-2"><div class="w-4 h-4 rounded bg-emerald-500"></div> Đang chọn</div>
        <div class="flex items-center gap-2"><div class="w-4 h-4 rounded bg-slate-900 border border-slate-600 opacity-40"></div> Đã bán</div>
      </div>
    </div>

    <!-- Nút thanh toán -->
    <div class="text-center">
      <button onclick="openCheckoutModal()" class="px-8 py-3 rounded-xl bg-red-600 hover:bg-red-700 font-semibold shadow-lg shadow-red-600/30 transition">
        Xác Nhận Đặt Vé & Thanh Toán
      </button>
    </div>
  </main>

  <!-- Giao diện Admin -->
  <main id="adminSection" class="hidden flex-1 max-w-6xl w-full mx-auto p-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
        <p class="text-slate-400 text-sm">Tổng Vé Đã Đặt</p>
        <h3 id="adminTickets" class="text-3xl font-bold mt-2 text-emerald-400">0</h3>
      </div>
      <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
        <p class="text-slate-400 text-sm">Doanh Thu Tạm Tính</p>
        <h3 id="adminRevenue" class="text-3xl font-bold mt-2 text-red-400">0 VNĐ</h3>
      </div>
      <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
        <p class="text-slate-400 text-sm">Tổng Số Phim</p>
        <h3 class="text-3xl font-bold mt-2 text-blue-400">4</h3>
      </div>
    </div>

    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold">Lịch Sử Đặt Vé Gần Đây</h2>
        <button onclick="clearAllData()" class="text-xs bg-red-950 text-red-400 border border-red-800 px-3 py-1.5 rounded-lg hover:bg-red-900">
          Xóa Lịch Sử
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-800 text-slate-400 text-xs uppercase">
            <tr>
              <th class="p-3">Mã Vé</th>
              <th class="p-3">Khách Hàng</th>
              <th class="p-3">Phim</th>
              <th class="p-3">Ghế</th>
              <th class="p-3">Tổng Tiền</th>
            </tr>
          </thead>
          <tbody id="adminTableBody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Đặt Vé Hoàn Tất -->
  <div id="checkoutModal" class="hidden fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4">
      <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-emerald-500"></i> Xác Nhận Thông Tin
      </h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Họ tên:</label>
          <input id="custName" type="text" placeholder="Nguyễn Văn A" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:outline-none">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Số điện thoại:</label>
          <input id="custPhone" type="text" placeholder="0901234567" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:outline-none">
        </div>
      </div>
      <div class="p-3 bg-slate-800/60 rounded-lg text-sm space-y-1">
        <p class="text-slate-400 text-xs">Chi tiết đặt chỗ:</p>
        <p id="modalDetails" class="font-medium text-slate-200"></p>
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button onclick="closeCheckoutModal()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm">Hủy</button>
        <button onclick="confirmBooking()" class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-sm font-semibold">Hoàn Tất</button>
      </div>
    </div>
  </div>

  <script>
    const ROWS = 6;
    const COLS = 8;
    let selectedSeats = [];
    let bookings = JSON
